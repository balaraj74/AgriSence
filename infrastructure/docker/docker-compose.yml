version: "3.9"

services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - ../../apps/web/.env.local
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
    env_file:
      - ../../apps/backend/.env
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.admin
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
